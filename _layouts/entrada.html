---
layout: default
---
<article class="entrada">
  <header class="capentrada">
    <h1>{{ page.title }}</h1>
    <time class="data" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time>
  </header>
  {{ content }}
  <p class="text"><a href="/blog/">Totes les entrades del blog</a></p>
</article>
