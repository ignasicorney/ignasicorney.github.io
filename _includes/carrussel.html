{% assign g = site.data.galeries[include.nom] %}
<section class="carrussel{% if include.tira %} tira{% endif %}" aria-roledescription="carrussel" aria-label="{{ include.titol }}">
  <ul class="pistes" tabindex="0">
  {% for i in g %}
    <li aria-roledescription="diapositiva" aria-label="{{ forloop.index }} de {{ g.size }}">
      <a href="/assets/img/web/{{ i.f }}.jpg" data-original="/assets/img/originals/{{ i.f }}.{{ i.ext }}" data-peu="{{ i.peu | escape }}">
        <img src="/assets/img/{% if include.tira %}mini{% else %}web{% endif %}/{{ i.f }}.jpg" alt="{{ i.peu | escape }}"{% unless forloop.first %} loading="lazy"{% endunless %} decoding="async">
      </a>
      {% unless include.tira %}<p class="peu-foto">{{ i.peu }}</p>{% endunless %}
    </li>
  {% endfor %}
  </ul>
  <div class="controls">
    <button type="button" class="ant" aria-label="Anterior">‹</button>
    {% unless include.tira %}<span class="compta" aria-live="polite">1/{{ g.size }}</span>{% endunless %}
    <button type="button" class="seg" aria-label="Següent">›</button>
  </div>
</section>
