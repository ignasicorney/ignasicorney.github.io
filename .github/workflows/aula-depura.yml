name: Aula depuració (temporal)
on:
  push:
    paths: ['.github/workflows/aula-depura.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pymupdf
      - name: Bolcat
        run: |
          mkdir -p dep
          curl -fsSL -o a.pdf "https://www.latinoamericana.org/digital/2015AgendaLatinoamericana.pdf" || true
          curl -fsSL -o b.pdf "$(grep -o 'https://[^"]*2026[^"]*\.pdf' tauler/aula/estat.json | grep -iv solo | grep -i 'llatino\|catala' | head -1)" || true
          python3 - <<'PY'
          import fitz,os
          for n in ("a","b"):
              if not os.path.exists(n+".pdf"): continue
              d=fitz.open(n+".pdf"); o=open(f"dep/{n}.txt","w")
              o.write(f"pagines {len(d)}\n")
              for p in list(range(40,52))+list(range(120,126)):
                  if p>=len(d): break
                  o.write(f"\n===== PAG {p+1}\n")
                  for b in d[p].get_text("dict")["blocks"]:
                      if b.get("type")!=0: continue
                      for l in b["lines"]:
                          sp=[s for s in l["spans"] if s["text"].strip()]
                          if not sp: continue
                          t="".join(s["text"] for s in l["spans"])
                          o.write(f'b{b["number"]:>3} x{l["bbox"][0]:5.0f} y{l["bbox"][1]:5.0f} s{max(s["size"] for s in sp):4.1f} f{sp[0]["flags"]:>2} {t[:90]}\n')
          PY
          git config user.name bot; git config user.email bot@x
          git checkout -b depura; git add -f dep; git commit -qm dep; git push -f origin depura
