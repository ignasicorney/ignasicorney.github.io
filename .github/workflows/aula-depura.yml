name: Aula depuració (temporal)
on:
  push:
    paths: ['.github/workflows/aula-depura.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pymupdf
      - name: Bolcat
        run: |
          mkdir -p dep
          curl -fsSL -o a.pdf "https://www.latinoamericana.org/digital/2015AgendaLatinoamericana.pdf" || true
          curl -fsSL -o b.pdf "$(grep -o 'https://[^"]*2026[^"]*\.pdf' tauler/aula/estat.json | grep -iv solo | grep -i 'llatino\|catala' | head -1)" || true
          for y in 2005 2020; do curl -fsSL -o $y.pdf "https://www.latinoamericana.org/digital/${y}AgendaLatinoamericana.pdf" || true; done
          python3 - <<'PY'
          import fitz,os,collections
          o=open("dep/toc.txt","w")
          for n in ("a","b","2005","2020"):
              if not os.path.exists(n+".pdf"): o.write(f"## {n} no baixat\n"); continue
              d=fitz.open(n+".pdf"); toc=d.get_toc()
              o.write(f"## {n} pag {len(d)} toc {len(toc)}\n")
              for e in toc[:25]: o.write(f"   {e}\n")
              fonts=collections.Counter()
              for p in d:
                  for b in p.get_text("dict")["blocks"]:
                      for l in b.get("lines",[]):
                          for sp in l["spans"]:
                              t=sp["text"].strip()
                              if len(t)==1 and not t.isdigit(): fonts[(sp["font"],t,round(sp["size"]))]+=1
              o.write(f"   un-caracter: {fonts.most_common(6)}\n")
              for p in range(40,46):
                  o.write(f"   -- p{p+1}\n")
                  for b in d[p].get_text("dict")["blocks"][:6]:
                      for l in b.get("lines",[])[:2]:
                          sp=[x for x in l["spans"] if x["text"].strip()]
                          if sp: o.write(f'      y{l["bbox"][1]:4.0f} s{sp[0]["size"]:4.1f} f{sp[0]["flags"]:>2} {sp[0]["font"][:18]:18} {"".join(x["text"] for x in l["spans"])[:70]}\n')
          PY
          git config user.name bot; git config user.email bot@x
          git checkout -b depura; git add -f dep; git commit -qm dep; git push -f origin depura
