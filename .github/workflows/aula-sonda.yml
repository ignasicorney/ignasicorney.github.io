name: Aula sonda (temporal)
on:
  push:
    paths: ['.github/workflows/aula-sonda.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests beautifulsoup4
      - shell: python
        run: |
          import requests, re, os, time
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          os.makedirs("sonda", exist_ok=True)
          S = requests.Session(); S.headers["User-Agent"] = "Mozilla/5.0"
          def get(u):
              for i in range(4):
                  try:
                      r = S.get(u, timeout=40); r.encoding = r.apparent_encoding; return r.text
                  except Exception as e:
                      print("ERR", u, e); time.sleep(5)
              return ""
          out = open("sonda/resum.txt", "w")
          B = "https://servicioskoinonia.org/agenda/archivo/"
          for pag in ["catalan/manyos.php", "manyos.php", "catalan/mtemas.php", "catalan/ma.php"]:
              h = get(B + pag); sp = BeautifulSoup(h, "html.parser")
              open("sonda/" + pag.replace("/", "_") + ".html", "w").write(h)
              links = [(a.get_text(" ", strip=True)[:60], urljoin(B + pag, a["href"])) for a in sp.find_all("a", href=True)]
              out.write(f"### {pag} ({len(h)} bytes, {len(links)} enllaços)\n" + "\n".join(f"  {t} -> {u}" for t, u in links[:60]) + "\n")
          for ll in ("catalan/", ""):
              u = B + ll + "listanyos.php?select=1&opcion=s&Submit=Consultar"; h2 = get(u); open("sonda/" + ll.strip("/") + "llista.html", "w").write(h2)
              sp2 = BeautifulSoup(h2, "html.parser")
              ll2 = [(a.get_text(" ", strip=True)[:70], urljoin(u, a["href"])) for a in sp2.find_all("a", href=True)]
              out.write(f"\n### LLISTA {u} ({len(h2)} bytes, {len(ll2)} enllaços)\n" + "\n".join(f"  {t} -> {x}" for t, x in ll2[19:50]) + "\n")
              cand = [x for t, x in ll2 if "servicioskoinonia.org" in x and not re.search(r"servicioskoinonia.org/?(\w+/?)?$", x) and "list" not in x]
              out.write(f"candidats {len(cand)}\n")
              if cand:
                  h3 = get(cand[5]); open("sonda/" + ll.strip("/") + "text.html", "w").write(h3)
                  out.write(f"\n### TEXT {cand[5]}\n" + BeautifulSoup(h3, "html.parser").get_text("\n", strip=True)[:2500] + "\n")
          out.close(); print(open("sonda/resum.txt").read()[:3000])
      - run: |
          git config user.name bot; git config user.email bot@x; git checkout -b sonda; git add -f sonda; git commit -qm s; git push -f origin sonda
