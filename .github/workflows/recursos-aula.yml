name: Recursos per a l'aula (Agenda Llatinoamericana)
on:
  workflow_dispatch:
  push:
    paths: ['_eines/aula_extreu.py', '.github/workflows/recursos-aula.yml']
  schedule:
    - cron: '17 4 28 11 *'   # un cop l'any, a finals de novembre (quan es presenta l'Agenda de l'any següent)
permissions:
  contents: write
concurrency:
  group: recursos-aula
  cancel-in-progress: false
jobs:
  extreu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependències
        run: pip install -q pymupdf requests beautifulsoup4
      - name: Baixar les edicions i extreure'n els textos
        run: python _eines/aula_extreu.py tauler/aula
      - name: Desar al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tauler/aula
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -m "Recursos per a l'aula: textos de l'Agenda Llatinoamericana actualitzats"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
